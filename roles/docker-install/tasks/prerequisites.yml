---
- name: Remove legacy Docker packages
  ansible.builtin.package:
    name:
      - docker
      - docker-engine
      - docker.io
      - podman-docker
      - containerd
      - runc
    state: absent
  when: docker_remove_old_packages

- name: Install prerequisites
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-jsondiff
      - python3-yaml
    state: present
    update_cache: true
