---
####################################################
# Docker version
####################################################

docker_install_channel: stable


####################################################
# Packages
####################################################

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - python3-docker


####################################################
# Users added to docker group
####################################################

docker_users: []


####################################################
# Service
####################################################

docker_service_enabled: true
docker_service_state: started


####################################################
# Daemon
####################################################

docker_daemon:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "5"
  live-restore: false


####################################################
# Validation
####################################################

docker_remove_old_packages: true
