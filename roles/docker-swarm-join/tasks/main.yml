---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - docker_swarm_manager_ip | length > 0
      - docker_swarm_join_token | length > 0

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check swarm status
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
  register: swarm_state
  changed_when: false

- name: Join swarm
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join
      - --token
      - "{{ docker_swarm_join_token }}"
      - "{{ docker_swarm_manager_ip }}:2377"
  when: swarm_state.stdout != "active"
