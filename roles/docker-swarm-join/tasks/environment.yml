---
- name: Determine Docker swarm environment
  ansible.builtin.set_fact:
    docker_swarm_environment: >-
      {{
        group_names
        | intersect([
            'production',
            'testing',
            'development',
            'management'
          ])
        | first
      }}

- name: Verify environment was found
  ansible.builtin.assert:
    that:
      - docker_swarm_environment is defined
      - docker_swarm_environment | length > 0
    fail_msg: >
      Could not determine swarm environment for {{ inventory_hostname }}.
      Host must belong to one of:
      production, testing, development, management
